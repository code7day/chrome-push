<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 320px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; }
  label { display: block; margin: 8px 0 2px; color: #888; font-size: 12px; }
  input { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
  .row { display: flex; gap: 6px; margin-top: 12px; }
  button { flex: 1; padding: 7px; font: inherit; cursor: pointer; }
  #status { margin-top: 10px; min-height: 2.6em; word-break: break-all; font-size: 12px; }
</style>
</head>
<body>
  <strong>Beezync Push Test</strong>
  <label for="baseUrl">URL del motor</label><input id="baseUrl">
  <label for="appId">App ID</label><input id="appId">
  <label for="publicKey">Llave pública</label><input id="publicKey">
  <label for="userId">Usuario externo (opcional)</label><input id="userId">
  <div class="row"><button id="sub">Suscribir</button><button id="unsub">Cancelar</button></div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
